[project]
name = "contextile"
dynamic = ["version"]
description = "Manage, retrieve, and compact AI project instructions, lessons learned, and contextual rules for LLM workflows."
authors = [
    { name="Joab Leite", email="leitejoab@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "llm",
    "ai",
    "agents",
    "context",
    "prompt-engineering",
    "instructions",
    "project-context",
    "lessons-learned",
    "memory",
    "retrieval",
    "context-management",
    "token-optimization",
    "mcp",
    "model-context-protocol",
    "cli",
    "developer-tools"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed"
]

requires-python = ">=3.10"

dependencies = [
    "cereja",
]

[tool.setuptools.dynamic]
version = {attr = "contextile.__version__"}

# Extras opcionais por framework
[project.optional-dependencies]
dev = ['pytest', 'pytest-cov', 'mcp>=1.0.0']
test = ['pytest', 'pytest-cov']
mcp = ["mcp>=1.0.0"]

[project.urls]
Homepage = "https://github.com/cereja-project/contextile"
Documentation = "https://github.com/cereja-project/contextile#readme"
Repository = "https://github.com/cereja-project/contextile"
Issues = "https://github.com/cereja-project/contextile/issues"
Changelog = "https://github.com/cereja-project/contextile/releases"


[build-system]
requires = ["setuptools", "wheel", "cereja"]
build-backend = "setuptools.build_meta"


[project.scripts]
contextile = "contextile.cli:main"

[tool.setuptools.package-data]
contextile = ["py.typed"]